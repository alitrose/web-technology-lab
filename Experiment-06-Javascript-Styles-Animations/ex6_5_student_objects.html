<!DOCTYPE html>
<html>
<head>
    <title>Student Details</title>
</head>
<body>

<h1>Student Details</h1>

<div id="result"></div>

<script>
var student = [
    {
        name: "John",
        r_num: "123",
        dob: "20-apr-1995"
    },
    {
        name: "Joseph",
        r_num: "456",
        dob: "05-jan-1998"
    }
];

var output = "";

for (var i = 0; i < student.length; i++) {

    output += student[i].name +
        "'s Register Number is " +
        student[i].r_num + "<br>";

    var year = new Date(student[i].dob).getFullYear();

    if (year < 2000) {
        output += "Born before 2000<br><br>";
    } else {
        output += "Born after 2000<br><br>";
    }
}

document.getElementById("result").innerHTML = output;
</script>

</body>
</html>
