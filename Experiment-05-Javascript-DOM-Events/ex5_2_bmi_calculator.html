<!DOCTYPE html>
<html>
<head>
    <title>BMI Calculator</title>
</head>
<body>
    <h2>Calculate Your Body Mass Index (BMI)!</h2>

    <fieldset>
        Weight (in kilograms):
        <input type="number" id="weight"><br><br>

        Height (in meters):
        <input type="number" id="height" step="0.01"><br><br>

        <button onclick="calculate()">Get BMI!</button>
    </fieldset>

    <p>Your BMI is <span id="score"></span></p>
    <p>Your body type is <span id="type"></span></p>

    <script>
        function calculate() {
            let weight = parseFloat(
                document.getElementById("weight").value
            );
            let height = parseFloat(
                document.getElementById("height").value
            );

            if (weight <= 0 || height <= 0 ||
                isNaN(weight) || isNaN(height)) {
                alert("Enter valid weight and height.");
                return;
            }

            let bmi = weight / (height * height);
            let type;

            if (bmi < 18) {
                type = "Underweight";
            } else if (bmi < 25) {
                type = "Normal";
            } else if (bmi <= 30) {
                type = "Overweight";
            } else {
                type = "Obese";
            }

            document.getElementById("score").innerHTML =
                bmi.toFixed(2);

            document.getElementById("type").innerHTML = type;
        }
    </script>
</body>
</html>
