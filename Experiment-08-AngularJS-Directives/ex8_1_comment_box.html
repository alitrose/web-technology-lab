<!DOCTYPE html>
<html lang="en" ng-app="commentApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Comment Box</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        textarea {
            width: 550px;
            max-width: 100%;
            height: 100px;
            display: block;
            margin-top: 10px;
        }
        button {
            margin-top: 10px;
            padding: 8px 15px;
            cursor: pointer;
        }
        li {
            margin: 10px 0;
        }
        a {
            color: red;
            text-decoration: none;
            margin-left: 20px;
        }
    </style>
</head>
<body ng-controller="FrmController">

    <h2>Post your Comment</h2>

    <form ng-submit="btn_add()">
        <textarea ng-model="txtcomment"
                  placeholder="Your Comment"
                  required></textarea>
        <button type="submit">Post Comment</button>
    </form>

    <h3>Comments</h3>

    <ul>
        <li ng-repeat="comnt in comment track by $index">
            {{ comnt }}
            <a href="" ng-click="remItem($index); $event.preventDefault()">x</a>
        </li>
    </ul>

    <script>
        angular.module("commentApp", [])
        .controller("FrmController", function($scope) {
            $scope.comment = [];

            $scope.btn_add = function() {
                if ($scope.txtcomment &&
                    $scope.txtcomment.trim() !== "") {
                    $scope.comment.push($scope.txtcomment);
                    $scope.txtcomment = "";
                }
            };

            $scope.remItem = function(index) {
                $scope.comment.splice(index, 1);
            };
        });
    </script>

</body>
</html>
